<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div style="padding: 30px; color: #cdd6f4; font-family: sans-serif;">
        <h2 style="color: #f9e2af; margin-bottom: 5px; border-bottom: 1px solid #313244; padding-bottom: 10px;">
            🔒 Konfigurasi Token Otoritas & Reset Node
        </h2>
        <p style="color: #bac2de; font-size: 0.9rem; margin-bottom: 25px;">
            Khusus area otorisasi Owner dan Admin Master. Token ini disinkronkan langsung dengan tameng berkas .env server VPS.
        </p>

        <!-- KOTAK PANEL UTAMA -->
        <div style="background: #181825; padding: 25px; border-radius: 8px; border: 1px solid #313244; max-width: 600px;">
            
            <!-- FORM 1: TOKEN DESTROY/WIPEOUT DB -->
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; color: #cdd6f4; margin-bottom: 8px; font-weight: bold;">
                    FRASA KONFIRMASI RESET HARDWARE (DB_TRUNCATE_CONFIRM_KEY)
                </label>
                <input type="password" id="input-token-reset" placeholder="Masukkan frasa konfirmasi penghancuran data..." 
                       style="width: 100%; padding: 10px; background: #11111b; border: 1px solid #45475a; border-radius: 4px; color: #a6e3a1; font-family: monospace; box-sizing: border-box;">
            </div>

            <!-- TOMBOL EKSEKUSI PEMBERSIHAN -->
            <div style="margin-top: 30px; border-top: 1px solid #313244; padding-top: 20px; display: flex; justify-content: space-between; align-items: center;">
                <span id="msg-status-token" style="font-size: 0.85rem; transition: color 0.3s ease;">Status: Siap siaga.</span>
                <button id="btn-trigger-reset" 
                        style="background: #f38ba8; color: #11111b; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;"
                        onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">
                    HANCURKAN DATA HARDWARE
                </button>
            </div>

        </div>
    </div>
</body>
</html>
