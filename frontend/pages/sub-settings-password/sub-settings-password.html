<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"></head>
<body>
    <div style="padding: 30px; color: #cdd6f4; font-family: sans-serif;">
        <h2 style="color: #f9e2af; margin-bottom: 5px; border-bottom: 1px solid #313244; padding-bottom: 10px;">
            🔑 Pembaruan Kata Sandi Mandiri
        </h2>
        <p style="color: #bac2de; font-size: 0.9rem; margin-bottom: 25px;">
            Demi menjaga keamanan siber, harap perbarui password default yang diberikan oleh Owner setelah login pertama kali.
        </p>

        <div style="background: #181825; padding: 25px; border-radius: 8px; border: 1px solid #313244; max-width: 450px;">
            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 0.85rem; color: #cdd6f4; margin-bottom: 8px; font-weight: bold;">KATA SANDI LAMA</label>
                <input type="password" id="pass-lama" placeholder="Masukkan kata sandi lama Anda..." style="width: 100%; padding: 10px; background: #11111b; border: 1px solid #45475a; border-radius: 4px; color: #cdd6f4; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; color: #cdd6f4; margin-bottom: 8px; font-weight: bold;">KATA SANDI BARU SEGAR</label>
                <input type="password" id="pass-baru" placeholder="Minimal 6 karakter..." style="width: 100%; padding: 10px; background: #11111b; border: 1px solid #45475a; border-radius: 4px; color: #a6e3a1; box-sizing: border-box;">
            </div>
            <button id="btn-submit-password" style="width: 100%; background: #f9e2af; color: #11111b; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">
                PERBARUI PASSWORD SAYA
            </button>
        </div>
    </div>
</body>
</html>
